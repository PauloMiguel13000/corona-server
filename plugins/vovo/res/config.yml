# Minigame Casa da Vovo
# Jogadores: /vovo (menu), /vovo entrar, /vovo sair
# Admin: /vovo admin <iniciar|parar|construir [limpar]|status|itens|item <id>|abrir|vovo|tp|lobby|modo <normal|dificil>|recarregar>
# Fugas: porta da frente (4 trancas), carro (3 pecas) ou esgoto (Chave Inglesa na tampa do bueiro + Serra na grade)

min-jogadores: 1           # quantos na fila para comecar a contagem (1 = da para jogar sozinho)
max-jogadores: 6           # com essa quantidade na fila a contagem cai para 8 segundos (nao e limite: entra quem quiser)
contagem-segundos: 20
dias: 5                    # (usado so se faltar em "modos") quantas vezes cada um pode ser pego (cada captura = um dia)
tempo-limite-minutos: 30   # 0 = sem limite
tabuas-que-rangem: 30
armadilhas: 4
besta-volta-segundos: 90   # depois do tiro, a besta reaparece em algum lugar da casa
claridade: 9               # luz extra invisivel dentro da casa (0 = so as lanternas, 15 = bem claro). Vale na proxima partida.
claridade-esgoto: 7        # a mesma coisa no esgoto

vovo:
  velocidade: 0.25         # velocidade base (atributo do Minecraft)
  ritmo-ronda: 0.65        # multiplicadores da velocidade base. A velocidade real cresce com o quadrado do ritmo:
  ritmo-investigar: 0.9    #   ronda ~1,2 blocos/s | indo ver um barulho ~2,2 blocos/s
  ritmo-caca: 1.0          #   correndo atras de alguem ~2,8 blocos/s (jogador andando faz 4,3 e correndo 5,6)
  dorme-segundos: 20       # no comeco ela dorme (um barulho alto acorda antes)
  dardo-segundos: 25       # quanto tempo ela dorme com o dardo da besta
  bonus-por-captura: 0.02  # fica um pouco mais rapida a cada captura
  bonus-maximo: 0.10       # no maximo ~3,3 blocos/s correndo atras

aranha:
  ativa: true              # a aranha gigante do esgoto
  tamanho: 1.8             # escala (1 = aranha normal). Grande demais para as passagens estreitas
  ritmo-ronda: 0.95        # (usado so se faltar em "modos") ~2,5 blocos/s rondando o esgoto
  ritmo-procura: 1.15      # indo ate onde viu alguem por ultimo
  ritmo-caca: 1.3          # ~4,6 blocos/s correndo atras (jogador andando faz 4,3)

# ---------------------------------------------------------------- dificuldade
# Os jogadores escolhem no menu (/vovo) ou com /vovo modo <normal|dificil>, antes da partida comecar.
# Velocidade real ~ 2,75 x ritmo x ritmo blocos/s (jogador andando faz 4,3 e correndo 5,6).
modo-padrao: normal
modos:
  normal:
    dias: 5
    ritmo-ronda: 0.75          # ~1,5 b/s
    ritmo-investigar: 1.0      # ~2,7 b/s
    ritmo-caca: 1.12           # ~3,4 b/s
    audicao: 1.25              # multiplica a distancia que ela ouve os barulhos
    visao: 18                  # alcance da visao (blocos)
    visao-agachado: 9          # alcance da visao se voce estiver agachado
    angulo: 70                 # abertura da visao para os lados (graus)
    memoria: 5                 # segundos que ela continua atras de voce depois de perder de vista
    visto-ao-esconder: 1.8     # se ela te viu ate X segundos antes de entrar no armario, ela sabe que voce esta la
    chance-armario: 0.3        # chance de abrir o armario perto de onde ela ouviu um barulho
    tabuas-que-rangem: 40
    armadilhas: 6
    dorme-segundos: 15
    primeira-visita: 60
    visita-segundos: 40        # de tempos em tempos ela vai ate perto de alguem (+ ate 30 s)
    chance-perto: 0.45
    dardo-segundos: 20
    bonus-por-captura: 0.03
    bonus-maximo: 0.12
    aranha-ritmo-ronda: 1.2       # ~3,9 b/s
    aranha-ritmo-procura: 1.34
    aranha-ritmo-caca: 1.44       # ~5,6 b/s: igual a voce correndo
    aranha-visao: 26
    aranha-visao-caca: 32
    aranha-angulo: 70
    aranha-ouve-correndo: 20      # ate quantos blocos ela ouve quem corre no esgoto
    aranha-ouve-andando: 7        # e quem anda (agachado ela nao ouve)
  dificil:
    dias: 3
    ritmo-ronda: 0.85          # ~2 b/s
    ritmo-investigar: 1.12     # ~3,4 b/s
    ritmo-caca: 1.25           # ~4,3 b/s: igual a voce andando, so correndo da para fugir
    audicao: 1.6
    visao: 22
    visao-agachado: 11
    angulo: 80
    memoria: 7
    visto-ao-esconder: 3
    chance-armario: 0.6
    tabuas-que-rangem: 55
    armadilhas: 10
    dorme-segundos: 8
    primeira-visita: 40
    visita-segundos: 28
    chance-perto: 0.6
    dardo-segundos: 12
    bonus-por-captura: 0.04
    bonus-maximo: 0.16
    aranha-ritmo-ronda: 1.28      # ~4,4 b/s
    aranha-ritmo-procura: 1.42
    aranha-ritmo-caca: 1.5        # ~6,1 b/s: mais rapida que voce correndo
    aranha-visao: 30
    aranha-visao-caca: 36
    aranha-angulo: 85
    aranha-ouve-correndo: 26
    aranha-ouve-andando: 10

# Comandos dados a quem fugir. %jogador% vira o nome. Exemplo: "give %jogador% diamond 3"
recompensa-comandos: []

# Skin da vovo (senhora de cabelo grisalho, da galeria publica do MineSkin). Nao precisa mexer.
skin:
  nome: Vovo
  uuid: 7d1f3c2a-5b4e-4a6f-9c8d-2e1b0a9f8c7d
  valor: ""
  assinatura: ""

# true = a vovo e o modelo 3D do pacote (Java e Bedrock); quem recusou o pacote ve o boneco com skin
modelo-3d: true

# O plugin preenche sozinho:
mapa-versao: 0
