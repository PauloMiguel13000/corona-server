# Minigame do Slenderman
# Jogadores: /slender (menu), /slender entrar, /slender sair
# Admin: /slender admin <iniciar|parar|construir [limpar]|status|folha|aparecer|tp|pontos|recarregar>

min-jogadores: 1          # quantos na fila para comecar a contagem (1 = da para jogar sozinho)
max-jogadores: 8          # com essa quantidade na fila a contagem cai para 10 segundos (nao e limite: entra quem quiser)
contagem-segundos: 30
folhas-para-vencer: 8
escala: 1.3               # tamanho do Slenderman (1.0 = altura normal de jogador)
distancia-visao: 5        # distancia de visao do mundo do Slenderman (em chunks); menor = mais neblina
teto-escuro: true         # true = floresta escura o tempo todo (vidro escuro no limite de altura segura a luz da lua); false = tira
escuridao-a-cada: 10      # segundos entre as piscadas (efeito Escuridao); com o Slenderman perto vem mais vezes
escuridao-duracao: 3      # segundos de cada piscada (de 2 a 15)
lanterna: true            # true = cada jogador recebe uma lanterna na mao esquerda
lanterna-alcance: 16      # ate quantos blocos a lanterna ilumina para onde o jogador olha
lanterna-luz: 12          # forca da luz no ponto iluminado (1 a 15)
lanterna-luz-perto: 6     # luz fraca logo a frente do jogador (0 = sem)

# Comandos dados a quem escapar. %jogador% vira o nome. Exemplo: "give %jogador% diamond 3"
recompensa-comandos: []

# Skin do Slenderman (conta "Slenderman" do Minecraft). Nao precisa mexer.
skin:
  nome: Slenderman
  uuid: 6e2d0364-65c7-475b-96d9-f4796a4c6f13
  valor: ""
  assinatura: ""

# O plugin preenche sozinho:
mapa-versao: 0
folhas-mapas: []
