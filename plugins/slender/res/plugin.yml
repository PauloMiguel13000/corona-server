name: Slender
version: '1.0'
main: br.servidor.slender.Slender
api-version: '1.21'
softdepend: [AuthMe, Multiverse-Core, BabyPets, Geyser-Spigot]
description: Minigame de terror - colete as 8 folhas na floresta escura antes que o Slenderman te pegue.
commands:
  slender:
    description: Minigame do Slenderman (/slender, /slender entrar, /slender sair)
    aliases: [slenderman, terror]
permissions:
  slender.jogar:
    description: Jogar o Slenderman
    default: true
  slender.admin:
    description: Administrar o minigame do Slenderman
    default: op
