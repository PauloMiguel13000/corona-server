name: Extras
version: '1.0'
main: br.servidor.extras.Extras
api-version: '1.21'
softdepend: [GriefPrevention, WorldGuard, Geyser-Spigot, floodgate, AuthMe, BabyPets]
description: Teleporte aleatorio (/rtp) e queda segura no spawn alto.
commands:
  eventos:
    description: O que tem de especial hoje no servidor
    aliases: [hoje, novidades, evento]
  youtube:
    description: Canal do YouTube do servidor
    aliases: [yt, canal, videos]
  semana:
    description: Os rankings semanais (tempo, chefes, Prisao) e a sua posicao
    aliases: [rankings, rankingsemanal, top]
  tempo:
    description: Ranking semanal de tempo jogado (premio em coronas)
    aliases: [tempojogado, toptempo]
  ferreiro:
    description: Ferreiro conserta o item da mao por coronas
    aliases: [reparar, consertar]
  conquistas:
    description: Conquistas com premio em coronas
    aliases: [conquista, metas]
  roleta:
    description: Roleta do Dia (uma girada gratis por dia)
    aliases: [girar, sorte]
  kits:
    description: Kits do lugar onde voce esta (Survival ou Masmorras)
    aliases: [kitlugar]
  tesouro:
    description: Caca ao Tesouro do Survival (/tesouro mostra a direcao)
    aliases: [cacatesouro, bautesouro]
  rtp:
    description: Teleporta para um lugar aleatorio e seguro do mapa
    aliases: [wild, tpr, aleatorio, randomtp]
  ec:
    description: Abre o seu bau do Ender de qualquer lugar
    aliases: [enderchest, echest, bauender]
  votar:
    description: Links para votar no servidor e pegar o premio (/votar pegar)
    aliases: [vote, votos]
  ip:
    description: Endereco do servidor (Java e Bedrock) para chamar os amigos
    aliases: [endereco, convidar]
  boss:
    description: Boss mundial - leva ate o Colosso quando ele esta acordado
    aliases: [bossmundial, colosso, chefao]
  ajuda:
    description: Guia do servidor - tudo o que da para fazer, com atalhos
    aliases: [guia, comandos, tutorial, comecar]
  missoes:
    description: Missoes do dia - 3 missoes novas todo dia valendo coronas
    aliases: [missao, diarias, diaria, missoesdiarias]
  discord:
    description: Link do Discord do servidor
    aliases: [dc, disc, discorde]
  indicar:
    description: Diz quem te chamou para o servidor (os dois ganham premio)
    aliases: [indicacao, quemmechamou]
  minigames:
    description: Abre o menu de minigames
    aliases: [minijogos, jogos]
  terror:
    description: Vai para o Lobby do Terror (jogos de terror)
    aliases: [lobbyterror]
  vip:
    description: 'VIPs do servidor (beneficios, kit do dia, particulas, chapeu, voar). Console - vip dar <jogador> <nivel> <dias>'
    aliases: [vips]
  extras:
    description: Administracao do plugin Extras
permissions:
  extras.rtp:
    description: Usar o /rtp
    default: true
  extras.rtp.semrecarga:
    description: Usar o /rtp sem esperar a recarga
    default: op
  extras.rtp.semespera:
    description: Teleportar na hora, sem ficar parado
    default: op
  extras.ec:
    description: Abrir o proprio bau do Ender com /ec
    default: true
  extras.ec.outros:
    description: Ver o bau do Ender de outro jogador (/ec <jogador>)
    default: op
  extras.vip.admin:
    description: Dar e tirar VIP (vip dar|tirar|ver|lista)
    default: op
  extras.admin:
    description: Recarregar a config
    default: op
