# Turno da Noite
instancias: 4            # escritorios ao mesmo tempo (cada um a 160 blocos do outro, no mundo turno_noite)
minutos-por-noite: 6     # 12 AM -> 6 AM
gasto-energia: 1.0       # multiplicador do gasto (0.1% por segundo por "barra" de uso)
# coop (/turno coop <nick>): cada vigia a mais deixa os bichos acordados mais espertos
coop:
  ia-a-mais-por-vigia: 2
  # /turno fila: segundos de espera depois que o primeiro entra (a sala cheia comeca em 3 s)
  fila-segundos: 30
recompensa:
  comando: "coronas dar %jogador% %valor%"
  noite-1: 30
  noite-2: 50
  noite-3: 80
  noite-4: 120
  noite-5: 200
  noite-6: 150
# IA por noite (0 a 20): tuca, jaca, capi, boto
ia:
  noite-1: [1, 1, 0, 0]
  noite-2: [3, 2, 0, 1]
  noite-3: [5, 4, 1, 2]
  noite-4: [7, 6, 2, 5]
  noite-5: [9, 8, 4, 7]
skins:
  ligado: true
  api: https://api.mineskin.org
  api-key: ""
  intervalo-segundos: 12
  user-agent: CoronaServer-TurnoNoite/1.0

# true = animatronicos sao os modelos 3D do pacote (Java e Bedrock); false = bonecos com skin
modelo-3d: true
