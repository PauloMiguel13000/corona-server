# Mundo de mineracao (plugin Mineracao)
# minutos ate a mina se refazer sozinha (se alguem minerou nela)
reset-minutos: 8
# refaz antes se essa fracao da mina ja foi minerada (0.7 = 70%)
reset-quando-minerado: 0.7
# de quais mundos o /minas leva para a mineracao (dos minigames nao)
mundos-com-acesso: [world, world_nether, world_the_end, plots, masmorras_mundo, masmorras_nether, masmorras_end, masmorras_spawn, mineracao]
# hora dourada: todo dia nessa hora (0-23, horario de Brasilia) a venda paga em dobro; -1 desliga
hora-dourada: 20
# versao das construcoes ja feitas (nao mexer)
construido: 0
