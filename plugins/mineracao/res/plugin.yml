name: Mineracao
version: 1.0
main: br.servidor.mineracao.Mineracao
api-version: '1.21'
author: Corona Server
softdepend: [GriefPrevention, Multiverse-Core]
description: Prisao (Rank Up) - mundo a parte com 12 minas, Mina PvP, dinheiro proprio, kits e encantamentos.
commands:
  minas:
    description: Abre o menu das minas (mundo de mineracao)
    aliases: [mineracao, mina]
  rankup:
    description: Sobe de rank na Prisao (paga com o dinheiro da Prisao)
  topminas:
    description: Ranking dos mineradores
  rank:
    description: Mostra seu rank de mineracao
  picareta:
    description: Mostra como deixar a picareta forte (encantar na Sala de Encantamentos)
  vender:
    description: Vende o minerio das minas (dinheiro da Prisao)
  prestigio:
    description: Depois do rank L, recomeca do A com bonus de venda para sempre
    aliases: [prestige]
  recompensa:
    description: Recompensa diaria da Prisao
    aliases: [diaria]
  missoes:
    description: Missoes do dia da Prisao
    aliases: [missao, quests]
  mineracaoadm:
    description: Admin da mineracao
    permission: mineracao.admin
permissions:
  mineracao.admin:
    default: op
