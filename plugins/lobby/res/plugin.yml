name: LoginLobby
version: '1.0'
main: br.servidor.lobby.LoginLobby
api-version: '1.21'
softdepend: [AuthMe, BabyPets, Multiverse-Core, Spawn]
description: Lobby leve para fazer /login sem lag; depois do login volta para onde estava.
commands:
  loginlobby:
    description: Administrar o lobby de login (/loginlobby reconstruir|ir|status)
    permission: loginlobby.admin
permissions:
  loginlobby.admin:
    default: op
